[project]
name = "hcl-tech-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taksheel", email = "duparetaksheel@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.34.0",
    "pypdf>=6.0,<7",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.40,<2",
    "torch>=2.15.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
hcl-tech-hackathon = "hcl_tech_hackathon:main"
hcl-frontend = "streamlit.web.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
